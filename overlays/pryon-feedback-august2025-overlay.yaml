  update:
    pryonOAuth2:
      type: oauth2
      description: >-
        Pryon APIs are authenticated with OAuth2 JWT bearer access tokens obtained from the
        client-credentials endpoint. The published specs model this as an apiKey header,
        which understates the flow documented at https://docs.pryon.com/reference/api-authentication.
      flows:
        clientCredentials:
          tokenUrl: https://auth-us-central-1.pryon.net/oauth/token
          scopes: {}
