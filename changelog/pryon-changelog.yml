- version: October 17, 2025 On-Prem/VPC Release
  date: '2025-10-17'
  url: https://docs.pryon.com/changelog/october-17-2025-onprem-release
  breaking: []
  additions:
  - Symphony Workflow Orchestration platform — low-code visual orchestration for agentic AI
    workflows with reusable Subflows and workflow templates, secure secret/constant/prompt
    management, and runtime observability of each component's input and output.
  - App Builder platform — no-code creation of conversational AI applications with branding
    and theme customization, multiple deployment modes (widget, full-screen, embedded), and
    draft/published lifecycle with cloning and versioning.
  - Enhanced chatbot experience — real-time streaming responses, GitHub Flavored Markdown,
    numbered clickable source citations, mobile-responsive layout, multi-tenant
    OAuth2/OIDC/client-grant authentication, configurable confidence thresholds and a
    Stop Generation control.
  - Expanded native UCP connector support for on-premises and federal deployments.
  notes: Release states backward compatibility was maintained for existing customers.
