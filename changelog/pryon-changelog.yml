- version: Q1 2026 Pryon Platform Release
  date: '2026-Q1'
  url: https://docs.pryon.com/changelog/q1-2026-release-notes
  breaking: []
  additions:
  - System of Record (SOR) metadata — ingest metadata schemas from a system of record and
    use them for entity extraction and advanced filtering, including boolean user-defined
    metadata fields and a metadata-content association query API.
  - Answer summarization with fine-grained attribution for more reliably grounded answers.
  - Structured outputs and function calling on Pryon models — a building block for agentic
    workflows on-premises.
  - Bring your own LLM with custom authentication for air-gapped or offline environments.
  - Symphony — production-ready real-time streaming for orchestration workflows; tool calling
    and structured outputs on the Pryon Generative node; natural language transformations
    generating Common Expression Language (CEL); a Pryon Memory Services node exposing all
    public Pryon Services API endpoints inside Symphony; Pryon Model Garden; Subflow
    Inheritance dashboard.
  - Application manager — single file upload in the chatbot interface, configurable feedback,
    and multi-collection/multi-workflow application support.
  - Ingestion — native DOCX and TXT ingestion, and PDF vision-merge performance improvements.
  - Connectors — SharePoint connector 0.2.10 to 0.4.3 with chunk-based content reads,
    ListItems support, per-service throttling and Retry-After handling; new File System
    connector; agentic query reasoning mode; query guardrails externalized as an API endpoint.
  security:
  - Read-only filesystems enforced across all major services.
  - vLLM services run as non-root with temporary directories for writes.
  - Comprehensive CVE remediation across all platform components.
  - Keycloak upgraded 26.3.3 to 26.4 with hardened security defaults.
  - New Content Admin permission model.
