    orgService:
      description: 'Represents a third-party service associated with this organization.

        Third-party services are used by the Pryon platform at runtime for various tasks.

        For example: file and content servers such as box.com, Google Drive, etc.'
      properties:
        service_id:
          description: 'A unique identifier for this service connect.

            Randomly generated uuid by server. Immutable after creation.'
          type: string
        service_name:
          description: 'A friendly name for this third-party service.

            Required for create operations. Can be modified after creation.'
          type: string
        type:
          $ref: '#/components/schemas/orgServiceType'
        authority:
          description: 'Authority that this service should be used with.

            For example, the authority of https://app.box.com/folder/0 is app.box.com.

            Required. Cannot be modified after creation.'
          type: string
        type_name:
          description: Required for UNIVERSAL_API type. The type name for this universal connector.
          type: string
        icon_url:
          description: 'Required for UNIVERSAL_API type. URL for an icon to be displayed for this universal connector.

            Supports public URL that not require authentication and base64 encoded data URL

            https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/Data_URLs

            data:image/png;base64,<base64data>

            Supported mime-type TBD.

            Recommended size TBD.'
          type: string
        attribute_settings:
          additionalProperties:
            $ref: '#/components/schemas/orgAttributeSetting'
          description: 'A map of attribute settings for this universal connector.

            The key is the AttributeSetting''s name.'
          type: object
        service_url:
          title: 'Required for UNIVERSAL_API type. This universal connector''s endpoint for Pryon''s Ingestion to pull the data from this connector.

            The Pryon platform will use this URL to query this connector.

            For example, http://int-xyz-connector.svc.cluster.local:8080'
          type: string
        base_url:
          title: 'The data source for this universal connector to retrieve the data.

            Base URL for underlying content endpoint.

            For example, https://api.servicenow.com'
          type: string
        default_query_parameters:
          additionalProperties:
            type: string
          title: 'Default query parameters for this universal connector to perform content discovery.

            These parameters be used when listing content from this connector to identify relevant URIs.

            They can be overwritten by the query parameters specified in the seed uri from ContentGroup.source_location.

            scheme://authority/path?query_key1=query_value1&query_key1=query_value1'
          type: object
        default_header_parameters:
          additionalProperties:
            type: string
          description: 'Default header parameters for this universal connector to perform content discovery.

            Similar to default_query_params, but for headers.'
          type: object
        max_pages_size:
          description: The max pages size to be used when listing content from this universal connector.
          format: int32
          type: integer
        max_bytes_size:
          description: The max bytes size to be used when getting content data from this universal connector.
          format: int32
          type: integer
        max_requests_per_second:
          description: The max requests/sec to be used when listing content and getting content data from this universal connector.
          format: int32
          type: integer
      type: object
    orgOrganization:
