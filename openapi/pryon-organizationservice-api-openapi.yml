      title: "- UNSPECIFIED: UNSPECIFIED: Default value that will never be used by the API as it is indistinguishable from unspecified status.\n - PENDING: PENDING: Waiting to be enabled by an organization admin.\nUseful to organization admins in gradually rolling out Pryon Platform access to organization users (e.g. bulk adding users and then enabling them in batches).\n - DISABLED_BY_ADMIN: DISABLED_BY_ADMIN: Administratively disabled by the organization admin (e.g. due to compromised credentials).\n - DISABLED_BY_SERVICE_OPERATOR: DISABLED_BY_SERVICE_OPERATOR: Disabled by a Pryon Service Operator (e.g. due to abuse).\nOnly a Pryon Service Operator can transition a user into and out of this state.\n - ACTIVE: ACTIVE: The user is in a functionally operational state"
      type: string
    orgBatchCreateUserRequest:
      description: BatchCreateUserRequest is the payload used for creating multiple users at once within an organization.
      properties:
        items:
          items:
            $ref: '#/components/schemas/orgUser'
          type: array
      type: object
    orgUpdateServiceRequest:
      properties:
        data:
          $ref: '#/components/schemas/orgServiceConnect'
