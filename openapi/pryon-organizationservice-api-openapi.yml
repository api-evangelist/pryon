      description: 'A user authenticated with Pryon can request their authorization information.

        If the Pryon platform cannot validate the user''s access grant it will respond with HTTP Unauthorized status.

        If the Pryon platform does not accept the user''s access grant it will respond with HTTP Forbidden status.'
      parameters:
      - name: Authentication
        in: header
        required: true
        schema:
          type: string
        example: 'Authorization: Bearer {base64-encoded-token}'
  /api/access/v1/users:
    get:
      operationId: OrganizationService_ListUsers
      parameters:
      - description: "Filter list outputs to only include users that match this status. Defaults to UNSPECIFIED which disables this filter.\nThe REST query parameter is \"status\" and value can be the string or integer representation.\n\n - UNSPECIFIED: UNSPECIFIED: Default value that will never be used by the API as it is indistinguishable from unspecified status.\n - PENDING: PENDING: Waiting to be enabled by an organization admin.\nUseful to organization admins in gradually rolling out Pryon Platform access to organization users (e.g. bulk adding users and then enabling them in batches).\n - DISABLED_BY_ADMIN: DISABLED_BY_ADMIN: Administratively disabled by the organization admin (e.g. due to compromised credentials).\n - DISABLED_BY_SERVICE_OPERATOR: DISABLED_BY_SERVICE_OPERATOR: Disabled by a Pryon Service Operator (e.g. due to abuse).\nOnly a Pryon Service Operator can transition a user into and out of this state.\n - ACTIVE: ACTIVE: The user is in a functionally operational state"
        in: query
        name: status
        schema:
          default: UNSPECIFIED
          enum:
          - UNSPECIFIED
          - PENDING
          - DISABLED_BY_ADMIN
          - DISABLED_BY_SERVICE_OPERATOR
          - ACTIVE
          type: string
      - description: "Filter list outputs to only include users of this type. Defaults to UNSPECIFIED which disables this filter.\nThe REST query parameter is \"type\" and value can be the string or integer representation.\n\n - UNSPECIFIED: UNSPECIFIED: Default value not used to characterize users internally.\n - HUMAN: HUMAN: A human user identified by a valid email address.\n - MACHINE: MACHINE: A machine user operating without human interaction and identified by its client id."
        in: query
        name: type
        schema:
          default: UNSPECIFIED
          enum:
          - UNSPECIFIED
          - HUMAN
          - MACHINE
          type: string
      - description: 'Filter list outputs to only include the users that use this knowledge collection as their default.

          The REST questy parameter is "default_collection_id".'
        in: query
        name: default_collection_id
        schema:
          type: string
      - description: 'The number of items to be returned. Valid values are 1-100. Default is 100.

          REST query parameter is "page_size".'
        in: query
        name: page_size
        schema:
          format: int32
          type: integer
      - description: 'In case of multiple pages, pages 2-N must specify this parameter using the value of next_page_token provided in response for previous page.

          REST query parameter is "page_token".

          see https://cloud.google.com/apis/design/design_patterns#list_pagination.'
        in: query
        name: page_token
        schema:
          type: string
      - name: Authentication
        in: header
        required: true
        schema:
          type: string
        example: 'Authorization: Bearer {base64-encoded-token}'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/orgListUsersResponse'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
