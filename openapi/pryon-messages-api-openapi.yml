openapi: 3.2.0
info:
  title: pryon/api/ext/analytics/v1/analytics.proto Messages API
  version: '1.0'
  contact:
    name: Pryon Product Support
    url: https://pryon.zendesk.com
    email: support@pryoninc.com
  description: '# Introduction

    The Pryon API blah blah blah.


    # Authentication

    When you sign up for an account, you are given your set of API credentials.



    Pryon supports authentication in the form of JSON Web Tokens.

    - JWT: authenticates each request by the http header: Authorization


    For all API requests, you will have to include the Authorization header in the following form:


    ```javascript

    Authorization: Bearer {encoded token}

    ```

    '
  license:
    name: Pryon
    url: https://pryon.com/license
  termsOfService: https://pryon.com/terms
  x-logo:
    url: 'data:image/png;base64, '
    altText: Pryon APIs
servers:
- url: https://api.pryon.net
  description: Pryon Cloud
tags:
- name: Messages
paths:
  /api/messages/v1/messages:
    get:
      operationId: Messages_ListMessages
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1ListMessagesResponse'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
          description: An unexpected error response.
      summary: ListMessages
      tags:
      - Messages
      description: List messages.
      parameters:
      - name: Authentication
        in: header
        required: true
        schema:
          type: string
        example: 'Authorization: Bearer {base64-encoded-token}'
  /api/messages/v1/messages/{message_id}:
    delete:
      operationId: Messages_DeleteMessage
      parameters:
      - description: The id of the message to delete.
        in: path
        name: message_id
        required: true
        schema:
          type: string
      - name: Authentication
        in: header
        required: true
        schema:
          type: string
        example: 'Authorization: Bearer {base64-encoded-token}'
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
          description: An unexpected error response.
      summary: DeleteMessage
      tags:
      - Messages
      description: Delete a message.
    get:
      operationId: Messages_GetMessage
      parameters:
      - in: path
        name: message_id
        required: true
        schema:
          type: string
      - name: Authentication
        in: header
        required: true
        schema:
          type: string
        example: 'Authorization: Bearer {base64-encoded-token}'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1GetMessageResponse'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
          description: An unexpected error response.
      summary: GetMessage
      tags:
      - Messages
      description: Get a message.
  /api/messages/v1/system-events:
    get:
      operationId: Messages_ListSystemEvents
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1ListSystemEventsResponse'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
          description: An unexpected error response.
      summary: ListSystemEvents
      tags:
      - Messages
      description: ListSystemEvents returns all system events for the user's organization.
      parameters:
      - name: Authentication
        in: header
        required: true
        schema:
          type: string
        example: 'Authorization: Bearer {base64-encoded-token}'
components:
  schemas:
    SystemEventSeverity:
      default: UNSPECIFIED
      description: " - UNSPECIFIED: UNSPECIFIED: Default value that will never be used by the API.\n - LOW: LOW: A scheduled activity will be occurring that is not expected to affect system usage.\n - MEDIUM: MEDIUM: Minor software updates that will not impact overall system functionality but may have temporary performance impacts.\n - HIGH: HIGH: System impacted and partial administrative and system functionality may be temporarily affected."
      enum:
      - UNSPECIFIED
      - LOW
      - MEDIUM
      - HIGH
      type: string
    v1ResourceMetadata:
      properties:
        uuid:
          description: UUID returned in the resource response, which represents the unique interaction with the API, that is, the response id.
          type: string
        create_time:
          description: Time of the initial request.
          format: date-time
          type: string
        update_time:
          description: 'Time of the last update.

            A value of 0 indicates it has never been updated.'
          format: date-time
          type: string
        response_time_millis:
          format: int64
          title: Time difference in milliseconds between when the request was received and when the response was generated
          type: integer
      type: object
    v1ListMessagesResponse:
      description: Ordered by create_time desc (most recent to oldest).
      properties:
        metadata:
          $ref: '#/components/schemas/v1CollectionMetadata'
        items:
          items:
            $ref: '#/components/schemas/v1GetMessageResponse'
          type: array
      type: object
    v1CollectionMetadata:
      properties:
        uuid:
          description: Random UUID returned in the resource response to represent the unique interaction with the API.  This can be thought of as a response id.
          type: string
        response_time_millis:
          description: Time difference in milliseconds between when the request was received and when the response was generated, that is, the latency.
          format: int64
          type: integer
      title: Metadata that will be returned with each collection-level GET
      type: object
    v1GetSystemEventResponse:
      properties:
        metadata:
          $ref: '#/components/schemas/v1ResourceMetadata'
        data:
          $ref: '#/components/schemas/v1SystemEvent'
      type: object
    v1Message:
      properties:
        message_id:
          description: Omit for create.
          type: string
        msg_type:
          $ref: '#/components/schemas/MessageMessageType'
        from:
          description: User id of sender. Defaulted to 'sys@pryoninc.com' in the MESSAGE_TYPE_NOTIFICATION case.
          type: string
        recipient:
          description: User id of the receiving user.
          type: string
        subject:
          description: Limit 128 bytes.
          type: string
        body:
          description: Limit 4096 bytes.
          type: string
        labels:
          additionalProperties:
            type: string
          title: 'Optional. Message key/value pair labels.

            Labels can be used to include additional information relevant to the type of message.

            Expect the following labels by message type:

            MESSAGE_TYPE_NOTIFICATION: collection_display_name, collection_id, knowledge_domain_id, knowledge_domain_status, knowledge_domain_status_reason'
          type: object
      type: object
    MessageMessageType:
      default: MESSAGE_TYPE_UNKNOWN
      description: ' - MESSAGE_TYPE_NOTIFICATION: Messages from Pryon platform.'
      enum:
      - MESSAGE_TYPE_UNKNOWN
      - MESSAGE_TYPE_NOTIFICATION
      type: string
    v1GetMessageResponse:
      properties:
        metadata:
          $ref: '#/components/schemas/v1ResourceMetadata'
        data:
          $ref: '#/components/schemas/v1Message'
      type: object
    protobufAny:
      properties:
        type_url:
          type: string
        value:
          format: byte
          pattern: ^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
          type: string
      type: object
    rpcStatus:
      properties:
        code:
          format: int32
          type: integer
        message:
          type: string
        details:
          items:
            $ref: '#/components/schemas/protobufAny'
          type: array
      type: object
    v1ListSystemEventsResponse:
      description: Ordered by create_time desc (most recent to oldest).
      properties:
        metadata:
          $ref: '#/components/schemas/v1CollectionMetadata'
        items:
          items:
            $ref: '#/components/schemas/v1GetSystemEventResponse'
          type: array
      type: object
    v1SystemEvent:
      properties:
        event_id:
          description: Required. Server assigned identifier for the given system event instance.
          type: string
        title:
          description: Required. A brief subject for the associated system event.
          type: string
        description:
          description: Optional. A description of this system event.
          type: string
        notify_time:
          description: Optional. Message clients may use this property to notify users in advance of upcoming system events.
          format: date-time
          type: string
        start_time:
          description: Required. Start time of system event.
          format: date-time
          type: string
        end_time:
          description: Required. End time of system event.
          format: date-time
          type: string
        severity:
          $ref: '#/components/schemas/SystemEventSeverity'
      type: object
