          $ref: '#/components/schemas/filename_v1alpha1ContentGroup'
      type: object
    filename_v1alpha1DataType:
      default: DATATYPE_UNSPECIFIED
      description: " - DATATYPE_UNSPECIFIED: Unspecified - indicates that data type is not set. This is not a valid option when creating a metadata field.\n - STRING: Free form text characters.\n - BOOLEAN: A boolean value (true or false).\n - INTEGER: Positive and negative whole numbers, but not decimals.\n - DECIMAL: Any number with decimal places.\n - DATETIME: Datetime string.\n - DATETIME_EPOCH: Datetime in epoch time format."
      type: string
