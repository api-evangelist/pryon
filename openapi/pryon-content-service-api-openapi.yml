      properties:
        code:
          format: int32
          type: integer
        message:
          type: string
        details:
          items:
            $ref: '#/components/schemas/filename_protobufAny'
          type: array
      type: object
    filename_v1alpha1CreateContentRequest:
      properties:
        data:
          $ref: '#/components/schemas/filename_v1alpha1Content'
      type: object
