          $ref: '#/components/schemas/filename_v1alpha1ResourceMetadata'
      type: object
    filename_ContentExtractPage:
      properties:
        text_boxes:
          items:
            $ref: '#/components/schemas/filename_PageTextBox'
          title: List of TextBoxes on the page
          type: array
