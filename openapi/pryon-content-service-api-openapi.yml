components:
  schemas:
    filename_PageTextBox:
      properties:
        bbox:
          title: 'Bounding box coordinates of the TextBox

            A string of four floating point numbers representing the top-left and bottom-right corners of the box separated by commas.

            The coordinates are in the format: x1,y1,x2,y2.'
          type: string
        text:
          title: Text within the bounding box
          type: string
        textlines:
          items:
            $ref: '#/components/schemas/filename_TextBoxTextLine'
          title: List of text lines within the TextBox
          type: array
        textline_start_index:
          title: Start index for the text line
          type: string
        vision_class:
          title: Vision class of the TextBox
          type: string
        timestamps:
          items:
            $ref: '#/components/schemas/filename_PageTextBoxTimestamp'
          title: 'List of timestamps

            Only available if the content is a video transcript'
          type: array
      title: TextBox level information
      type: object
    filename_v1alpha1CreateContentGroupRequest:
      properties:
        data:
          $ref: '#/components/schemas/filename_v1alpha1ContentGroup'
      type: object
    filename_v1alpha1ContentGroupContentRequest:
      properties:
        data:
          $ref: '#/components/schemas/filename_v1alpha1ContentGroupContent'
      type: object
    filename_v1alpha1ListSubjectsResponse:
      properties:
        metadata:
          $ref: '#/components/schemas/filename_v1alpha1CollectionMetadata'
        items:
          description: Subjects matching request criteria.
          items:
            $ref: '#/components/schemas/filename_v1alpha1GetSubjectResponse'
          type: array
        next_page_token:
          title: For multiple pages; must be specified in each request for two pages per sheet.
          type: string
        page_size:
          description: Same as page size in request.
          format: int32
          type: integer
        order_by:
          description: Same as order by in request.
          type: string
      type: object
    filename_v1alpha1SummaryItem:
      properties:
        text:
          type: string
        html:
          type: string
      type: object
    filename_v1alpha1ListContentItem:
      properties:
        data:
          $ref: '#/components/schemas/filename_v1alpha1Content'
