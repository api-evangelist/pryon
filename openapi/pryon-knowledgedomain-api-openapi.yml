      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domainListDomainsResponse'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: ListDefaultDomains
      tags:
      - KnowledgeDomain
      description: List the Knowledge Domains the authorized user can implicitly access in the absence of any team assignments (defaults).
      parameters:
      - name: Authentication
        in: header
        required: true
        schema:
          type: string
        example: 'Authorization: Bearer {base64-encoded-token}'
  /api/knowledge/v1alpha1/domains:createWithSources:
    servers:
