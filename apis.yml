aid: pryon
name: Pryon
description: 'Pryon is a Raleigh, North Carolina enterprise AI company founded in 2017
  by Igor Jablokov that provides a retrieval-augmented generation (RAG) platform for
  regulated and security-conscious organizations. The Pryon RAG Suite couples an Ingestion
  Engine (filetype handling, layout analysis, OCR/HTR, table structure recognition and
  semantic segmentation), a Retrieval Engine (vast search, query canonicalization, query
  classification, metadata filtering, verified answers) and a Generative Engine (chat
  completions, guardrails, query rewriting, answer summarization) behind a single set of
  REST APIs. Symphony, its low-code orchestration builder, composes those engines into
  custom RAG and agentic workflows. Content is ingested through prebuilt connectors for
  SharePoint, Salesforce, Amazon S3, Azure Blob Storage, Google Cloud Storage, NFS and a
  Universal Connector, and the platform is deployed in Pryon SaaS, customer VPC, on-premises
  and air-gapped environments. All 276 published operations are documented at docs.pryon.com,
  which also serves an llms.txt index for agents.'
