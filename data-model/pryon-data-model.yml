notes: |
  Derived from the resource hierarchy of the published paths and from the id-reference fields
  that recur across component schemas. Pryon's API is generated from Protocol Buffers and
  follows Google AIP resource naming: an org owns teams, users, solutions and services; a
  knowledge Collection is the durable customer-facing object and points at a versioned
  KnowledgeDomain, which is what content is actually ingested into; conversation objects
  (Exchange, Retrieval, GenerativeRetrieval) reference a collection and produce ratings,
  reviews, approvals and verified answers.
domains:
  access: /api/access/v1 — organizations, teams, users, IdPs, integrations, solutions, services
  knowledge: /api/knowledge/v1 and /api/knowledge/v1alpha1 — collections, domains, contents, content groups, subjects, metadata fields
  connector: /api/connector/v1 and /api/connector/v1alpha1 — connectors and the Universal Connector contract
  conversation: /api/conversation/v1 and /api/conversation/v1alpha1 — exchanges, retrievals, ratings, reviews, approvals, verified answers
  generative: /api/generative/v1alpha1 — chat completions and generative tasks
  analytics: /api/analytics/v1 — aggregate counts and confidence/rating category rollups
  messages: /api/messages/v1 — messages and system events
  regression: /api/regression/v1 — regression test collections and tests
  speech: /api/speech/v1 — text-to-speech synthesis
